name: Correction automatique JSON

on:
  push:
    paths:
      - '*.json'
      - 'fr/*.json'

jobs:
  corriger-json:
    runs-on: ubuntu-latest

    steps:
      - name: Cloner le dépôt
        uses: actions/checkout@v3

      - name: Configurer Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Lancer le script de correction
        run: |
          python corriger_json.py

      - name: Commit et push des fichiers modifiés
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add .
          git diff --cached --quiet || git commit -m "🔧 Correction automatique des fichiers JSON"
          git push
