      - name: Commit & push (si fichiers modifiés)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"

          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "🔧 Correction automatique des fichiers JSON"

            # ✅ Reconfigurer remote avec token pour autoriser le pull
            git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}

            # 🩹 Tirer les derniers commits et rebaser dessus
            git pull --rebase origin "${{ github.ref_name }}"

            # 🟢 Pusher
            git push
          else
            echo "Pas de modifications détectées"
          fi
