name: Correction automatique JSON

on:
  push:
    branches: [ SSTFR ]
    paths:
      - '*.json'
      - 'fr/*.json'
      - 'corriger_json.py'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  corriger-json:
    runs-on: ubuntu-latest

    steps:
      - name: Cloner le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurer Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # Si tu as des deps pip, ajoute une étape "pip install -r requirements.txt" ici

      - name: Lancer le script de correction (deflatten + apply)
        run: |
          python corriger_json.py --root . --rules key_rules.json --deflatten --apply --backup

      - name: Commit et push (si fichiers modifiés)
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "✅ Aucun changement à pousser."
          else
            git commit -m "fix: deflatten Crowdin JSON + corrections"
            git push || echo "⚠️ git push a échoué, mais on continue."
          fi
